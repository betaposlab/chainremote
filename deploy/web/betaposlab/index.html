<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetaPosLab - Smart Tools</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%23003399'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='350' fill='%23ffffff'>B</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        html {
            background-color: #000;
        }
        
        body {
            background-color: transparent;
            color: #ffffff;
            margin: 0;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== 은하수 배경 ===== */
        .galaxy-bg {
            position: fixed; inset: 0; z-index: -1;
            background: #000; overflow: hidden; pointer-events: none;
        }
        .galaxy-photo {
            position: absolute; inset: 0;
            background-image: url('/images/galaxy-bg.jpg');
            background-size: 120% auto;
            background-position: 30% 40%;
            background-repeat: no-repeat;
        }
        @media (max-width: 768px) {
            .galaxy-photo {
                background-size: cover;
                background-position: center;
            }
        }
        .galaxy-photo::after {
            content: ''; position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%),
                linear-gradient(180deg, rgba(20,10,40,0.25) 0%, rgba(10,5,25,0.45) 100%);
        }
        .galaxy-stars { position: absolute; inset: 0; }
        .galaxy-stars canvas { width: 100%; height: 100%; display: block; }
        .galaxy-meteors { position: absolute; inset: 0; overflow: hidden; }
        .galaxy-meteor {
            position: absolute;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: radial-gradient(circle,
                #ffffff 0%, #fff4d0 30%, #ffd890 55%,
                rgba(255,180,90,0.5) 80%, transparent 100%);
            box-shadow:
                0 0 6px 1px rgba(255,240,200,0.95),
                0 0 14px 3px rgba(255,200,120,0.6),
                0 0 26px 6px rgba(255,160,80,0.25);
            opacity: 0;
        }
        .galaxy-meteor::before {
            content: '';
            position: absolute;
            right: 2px; top: 50%;
            width: 220px; height: 2.4px;
            transform: translateY(-50%);
            background: linear-gradient(270deg,
                rgba(255,255,255,0.95) 0%,
                rgba(255,240,200,0.92) 6%,
                rgba(255,210,140,0.85) 22%,
                rgba(255,170,90,0.65) 45%,
                rgba(220,110,60,0.40) 68%,
                rgba(140,50,40,0.18) 86%,
                rgba(60,20,20,0) 100%);
            -webkit-mask-image: linear-gradient(180deg,
                transparent 0%, #000 35%, #000 65%, transparent 100%);
                    mask-image: linear-gradient(180deg,
                transparent 0%, #000 35%, #000 65%, transparent 100%);
            border-radius: 2px;
        }
        .galaxy-meteor::after {
            content: '';
            position: absolute;
            right: 0; top: 50%;
            width: 70px; height: 6px;
            transform: translateY(-50%);
            background: linear-gradient(270deg,
                rgba(255,235,180,0.55) 0%,
                rgba(255,200,120,0.30) 50%,
                rgba(255,160,80,0) 100%);
            -webkit-mask-image: radial-gradient(ellipse 80% 100% at right center,
                #000 0%, transparent 80%);
                    mask-image: radial-gradient(ellipse 80% 100% at right center,
                #000 0%, transparent 80%);
            border-radius: 50%;
        }
        @keyframes galaxy-meteor-fly {
            0%   { transform: translate(0, 0) rotate(135deg); opacity: 0; }
            8%   { opacity: 1; }
            100% { transform: translate(-700px, 700px) rotate(135deg); opacity: 0; }
        }

        .lang-btn { position: absolute; top: 30px; right: 30px; border: 1px solid #555; border-radius: 20px; padding: 8px 16px; color: #aaa; font-size: 0.9rem; font-weight: 500; cursor: pointer; z-index: 100; transition: 0.3s; user-select: none; background: rgba(0,0,0,0.5); }
        .lang-btn:hover { border-color: #fff; color: #fff; background-color: #333; }

        .text-section { 
            text-align: center; 
            margin-bottom: 30px; 
            margin-top: 60px; 
            padding: 0 20px; 
            position: relative; 
            z-index: 10; 
        }
        .logo-text { font-family: 'Montserrat', sans-serif; font-size: 3rem; font-weight: 900; background: linear-gradient(to right, #3498db, #8e44ad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; display: inline-block; }
        .secret-link { text-decoration: none; cursor: pointer; -webkit-text-fill-color: inherit; }
        .slogan { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; min-height: 1.5em; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .desc { color: #ccc; font-size: 0.9rem; line-height: 1.5; min-height: 3em; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        .interaction-prompt {
            color: #3498db; font-weight: 700; font-size: 1rem; margin-bottom: 15px; opacity: 1;
            transition: opacity 0.8s ease, transform 0.8s ease;
            animation: pulse 2s infinite; cursor: pointer;
            text-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.7; }
        }
        .prompt-hidden { opacity: 0 !important; transform: translateY(20px) !important; pointer-events: none; animation: none !important; }

        .phone-container {
            position: relative; 
            width: 300px; 
            height: 620px; 
            perspective: 1000px; 
            margin-bottom: 30px; 
            cursor: pointer; 
            -webkit-tap-highlight-color: transparent;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), margin 1.2s;
            z-index: 10;
        }
        .phone-body {
            width: 100%; height: 100%; position: relative; transform-origin: center center;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #000; border: 14px solid #222; border-radius: 55px;
            box-shadow: 0 0 0 2px #444, 0 30px 60px rgba(0,0,0,0.7); box-sizing: border-box; overflow: hidden; 
        }
        .phone-container.active .phone-body { transform: rotate(-90deg); }
        .phone-container.active .img-portrait { opacity: 0; }
        .phone-container.active .img-landscape { opacity: 1; }
        @media (hover: hover) {
            .phone-container:hover .phone-body { transform: rotate(-90deg); }
            .phone-container:hover .img-portrait { opacity: 0; }
            .phone-container:hover .img-landscape { opacity: 1; }
        }
        .phone-screen { position: absolute; transition: opacity 1.2s ease-in-out; width: 100%; height: 100%; object-fit: cover; }
        .img-portrait { opacity: 1; z-index: 2; }
        .img-landscape { width: 620px; height: 300px; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(90deg); opacity: 0; z-index: 1; }

        .btn-container { 
            margin-top: 10px; 
            margin-bottom: 40px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px; 
            padding: 0 20px; 
            width: 100%; 
            max-width: 500px; 
            position: relative; 
            z-index: 10; 
        }
        .store-group { display: flex; gap: 15px; width: 100%; justify-content: center; }
        .link-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .btn-base {
            padding: 12px 25px; border-radius: 30px; text-decoration: none; font-size: 0.95rem; white-space: nowrap; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px;
            backdrop-filter: blur(5px);
        }
        .store-btn { background-color: rgba(0,0,0,0.8); border: 1px solid #555; color: #fff; flex: 1; max-width: 180px; }
        .store-btn:hover { background-color: #333; border-color: #fff; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255,255,255,0.1); }
        .store-icon { font-size: 1.2rem; }
        .contact-btn { border: 2px solid #555; color: white; background: rgba(0,0,0,0.3); }
        .contact-btn:hover { border-color: #fff; background-color: #333; }
        .download-link-btn {
            background-color: rgba(52, 152, 219, 0.9); border: 2px solid #3498db; color: white; font-weight: bold; box-shadow: 0 0 15px rgba(52, 152, 219, 0.5); width: 100%; max-width: 380px;
        }
        .download-link-btn:hover { background-color: #2980b9; border-color: #2980b9; transform: scale(1.02); box-shadow: 0 0 25px rgba(52, 152, 219, 0.8); }
        footer { 
            margin-top: 50px; 
            color: #666; 
            font-size: 0.8rem; 
            text-align: center; 
            line-height: 1.5; 
            padding: 0 20px 20px 20px; 
            position: relative; 
            z-index: 10; 
        }
        @media (max-width: 768px) {
            .logo-text { font-size: 2.2rem; }
            .phone-container { transform: scale(0.55); margin-top: -120px; margin-bottom: -120px; }
            .interaction-prompt { font-size: 0.9rem; }
            .store-group { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- 은하수 배경 시작 -->
    <div class="galaxy-bg">
      <div class="galaxy-photo"></div>
      <div class="galaxy-stars"><canvas id="galaxyStars"></canvas></div>
      <div class="galaxy-meteors" id="galaxyMeteors"></div>
    </div>
    <!-- 은하수 배경 끝 -->

    <div class="lang-btn" onclick="toggleLanguage()">한국어</div>

    <div class="text-section">
        <div class="logo-text">BetaPosLa<a href="staff" class="secret-link">b</a>.</div>
        <div class="slogan" id="slogan-text">Smart Tools for the Lazy Genius.</div>
        <div class="desc" id="desc-text">We work for the lazy geniuses.<br>Ultimate rest with just one finger tap.</div>
    </div>

    <div id="interaction-prompt" class="interaction-prompt">
        👉 Tap / Hover to Rotate 👈
    </div>

    <div class="phone-container" id="phone">
        <div class="phone-body">
            <img src="images/app_portrait.png" class="phone-screen img-portrait" alt="Portrait Mode">
            <img src="images/app_landscape.png" class="phone-screen img-landscape" alt="Landscape Mode">
        </div>
    </div>

    <div class="btn-container">
        <div class="store-group">
            <a href="https://apps.apple.com/app/mini-keyboard/id6763819415" class="btn-base store-btn" target="_blank" rel="noopener">
                <i class="fab fa-apple store-icon"></i> App Store
            </a>
            <a href="#" class="btn-base store-btn" onclick="alert('Google Play 출시 준비 중입니다.\nComing Soon!'); return false;">
                <i class="fab fa-google-play store-icon"></i> Google Play
            </a>
        </div>

        <a href="downloads.html" class="btn-base download-link-btn" id="download-btn">
            <i class="fas fa-desktop"></i> PC Server Download
        </a>

        <div class="link-group">
            <a href="manual.html" class="btn-base contact-btn" style="border-color: #8e44ad; color: #fff;">User Guide</a>
            <a href="contact.html" class="btn-base contact-btn" id="contact-btn">Contact Us</a>
        </div>
    </div>

    <footer>
        &copy; 2026 BetaPosLab. All rights reserved.<br>
        <a href="privacy.html" style="color: #666; text-decoration: none; font-size: 0.7rem; margin-top: 5px; display: inline-block;">Privacy Policy</a>
    </footer>

    <script>
        // ==========================================
        // 🌌 은하수 배경 (사진 + 별 깜빡임 + 유성)
        // ==========================================
        (function () {
            // ===== 별 깜빡임 =====
            const canvas = document.getElementById('galaxyStars');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let stars = [];
            const STAR_COUNT = window.innerWidth < 768 ? 90 : 180;
            function resize() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = canvas.offsetWidth * dpr;
                canvas.height = canvas.offsetHeight * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                buildStars();
            }
            function buildStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * canvas.offsetWidth,
                        y: Math.random() * canvas.offsetHeight,
                        r: Math.random() * 1.4 + 0.3,
                        base: Math.random() * 0.6 + 0.2,
                        speed: Math.random() * 0.02 + 0.005,
                        phase: Math.random() * Math.PI * 2,
                        hue: Math.random() < 0.85 ? 0 : (Math.random() < 0.5 ? 30 : 220),
                    });
                }
            }
            function tick(t) {
                ctx.clearRect(0, 0, canvas.offsetWidth, canvas.offsetHeight);
                for (const s of stars) {
                    const a = Math.max(0.05, Math.min(1, s.base + Math.sin(t * s.speed + s.phase) * 0.35));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = s.hue === 0 ? `rgba(255,255,255,${a})`
                                  : s.hue === 30 ? `rgba(255,230,180,${a})`
                                  : `rgba(180,210,255,${a})`;
                    ctx.fill();
                    if (s.r > 1.1) {
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,255,255,${a * 0.08})`;
                        ctx.fill();
                    }
                }
                requestAnimationFrame(tick);
            }
            window.addEventListener('resize', resize);
            resize();
            requestAnimationFrame(tick);
            // ===== 유성 =====
            const layer = document.getElementById('galaxyMeteors');
            function spawnMeteor() {
                const m = document.createElement('div');
                m.className = 'galaxy-meteor';
                m.style.left = (Math.random() * window.innerWidth + 200) + 'px';
                m.style.top = (Math.random() * window.innerHeight * 0.4) + 'px';
                const dur = 1.4 + Math.random() * 1.2;
                m.style.animation = `galaxy-meteor-fly ${dur}s linear forwards`;
                layer.appendChild(m);
                setTimeout(() => m.remove(), dur * 1000 + 100);
            }
            setInterval(() => { if (Math.random() < 0.5) spawnMeteor(); }, 2200);
        })();

        // ==========================================
        // 기존 기능 유지 (언어, 터치 등)
        // ==========================================
        const translations = {
            en: {
                slogan: "Smart Tools for the Lazy Genius.",
                desc: "We work for the lazy geniuses.<br>Ultimate rest with just one finger tap.",
                download: "<i class='fas fa-desktop'></i> PC Server Download",
                contact: "Contact Us", btnLabel: "한국어", prompt: "👉 Tap / Hover to Rotate 👈"
            },
            ko: {
                slogan: "게으른 천재들을 위한 스마트한 도구.",
                desc: "우리는 게으른 천재들을 위해 일합니다.<br>단 한 번의 손가락 탭으로 완성되는 궁극의 휴식.",
                download: "<i class='fas fa-desktop'></i> PC 서버 다운로드",
                contact: "문의하기", btnLabel: "English", prompt: "👉 탭하거나 마우스를 올려보세요 👈"
            }
        };
        let isEnglish = true; let hasInteracted = false; 
        window.onload = function() {
            const savedLang = localStorage.getItem('siteLanguage');
            if (savedLang === 'ko') { toggleLanguage(); }
            const phone = document.getElementById('phone');
            ['mouseover', 'click', 'touchstart'].forEach(evt => phone.addEventListener(evt, hidePrompt, {once: true}));
        };
        function hidePrompt() { if (!hasInteracted) { const prompt = document.getElementById('interaction-prompt'); if (prompt) prompt.classList.add('prompt-hidden'); hasInteracted = true; } }
        function toggleLanguage() {
            isEnglish = !isEnglish;
            const lang = isEnglish ? translations.en : translations.ko;
            document.getElementById('slogan-text').innerHTML = lang.slogan;
            document.getElementById('desc-text').innerHTML = lang.desc;
            document.getElementById('download-btn').innerHTML = lang.download;
            document.getElementById('contact-btn').innerText = lang.contact;
            document.querySelector('.lang-btn').innerText = lang.btnLabel;
            const prompt = document.getElementById('interaction-prompt');
            if(prompt) prompt.innerText = lang.prompt;
            localStorage.setItem('siteLanguage', isEnglish ? 'en' : 'ko');
        }
        const phone = document.getElementById('phone');
        phone.addEventListener('click', function(e) { this.classList.toggle('active'); });
    </script>
</body>
</html>
