# ChainRemote 관리 패널 — Synology NAS Container Manager 용 compose 파일.
#
# 정석 근거: Synology Container Manager Project 가 docker-compose v3.8 호환.
#   https://kb.synology.com/en-global/DSM/help/ContainerManager/docker_project
#
# 사용:
#   1. 이 폴더를 NAS 의 /volume1/docker/chainremote-admin/ 에 복사
#   2. .env 파일 생성 (DB_PASSWORD, AUTH_SECRET 박음 — git 에 안 들어감)
#   3. Container Manager → Project → 생성 → 이 폴더 가리킴
#   4. 빌드 + 시작
#
# 또는 SSH:
#   cd /volume1/docker/chainremote-admin
#   docker compose up -d --build

services:
  chainremote-admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: chainremote-admin:latest
    container_name: chainremote-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
      # NAS LAN IP 로 DB 컨테이너 (chainremote-postgres) 도달.
      # 다음 sprint: user-defined docker network 로 컨테이너 이름 직접 사용.
      DATABASE_URL: "postgres://chainremote:${DB_PASSWORD}@192.168.68.103:15432/chainremote"
      # next-auth v5 — production JWT 서명에 필수. 없으면 모든 인증 요청 throw.
      # NAS .env 의 AUTH_SECRET 주입. (구 ADMIN_USER/ADMIN_PASSWORD 는 DB+next-auth
      #  전환으로 코드 미사용 → dead config 라 제거.)
      AUTH_SECRET: "${AUTH_SECRET}"
    healthcheck:
      # /login 은 미들웨어 matcher 제외 경로 → 인증 없이 200. 루트(/)는 401 이라
      # healthcheck 가 거짓 unhealthy 였음. 인증 코드는 무변경(철칙).
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
